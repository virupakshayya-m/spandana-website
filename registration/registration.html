<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spandana 2026 | Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Open+Sans&display=swap" rel="stylesheet">

  <!-- Register CSS -->
  <link rel="stylesheet" href="registration.css">
</head>

<body>

<div class="overlay"></div>

<section class="register-section">
  <h3>🎭 Spandana 2026 Registration</h3>
  <p class="register-subtitle">
    Be a part of the biggest cultural celebration
  </p>

  <form class="register-form">

    <!-- PERSONAL INFO -->
    <h4 class="form-title">👤 Personal Details</h4>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" placeholder="Your full name" required>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" placeholder="example@email.com" required>
    </div>

    <div class="form-group">
      <label>Mobile Number</label>
      <input type="tel" placeholder="10-digit mobile number" required>
    </div>

    <!-- PARTICIPATION -->
    <h4 class="form-title">🎯 Participation</h4>

    <div class="form-group">
      <label>Gender</label>
      <div class="radio-group">
        <input type="radio" id="male" name="gender" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender">
        <label for="other">Other</label>
      </div>
    </div>

    <div class="form-group">
      <label>Participation Type</label>
      <div class="radio-group">
        <input type="radio" id="solo" name="participation" onclick="toggleGroup(false)" required>
        <label for="solo">Solo</label>

        <input type="radio" id="group" name="participation" onclick="toggleGroup(true)">
        <label for="group">Group</label>
      </div>
    </div>

    <!-- GROUP SIZE (HIDDEN INITIALLY) -->
    <div class="form-group" id="groupSizeBox" style="display:none;">
      <label>Number of Group Members</label>
      <input type="number" min="2" max="20" placeholder="Enter group size">
    </div>

    <div class="form-group">
      <label>Select Event</label>
      <select required>
        <option value="">Choose an event</option>
        <option>Dance</option>
        <option>Music</option>
        <option>Drama</option>
        <option>Fashion Show</option>
        <option>Fun Games</option>
      </select>
    </div>

    <!-- EXTRA MESSAGE -->
    <h4 class="form-title">💬 Additional Info</h4>

    <div class="form-group">
      <label>Any Message (Optional)</label>
      <textarea rows="3" placeholder="Tell us something about your performance..."></textarea>
    </div>

    <button type="submit" class="register-btn">
      🚀 Submit Registration
    </button>

  </form>

  <a href="../index.html" class="back-btn">← Back to Home</a>

</section>

<!-- SMALL JS -->
<script>
  function toggleGroup(show) {
    document.getElementById("groupSizeBox").style.display = show ? "block" : "none";
  }
</script>

</body>
</html>
